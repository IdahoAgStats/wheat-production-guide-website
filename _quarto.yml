 #       collapse-after: 5
 #       copy-button: true
 # navbar:
#    right:
#      - href: index.qmd
#        text: Home
#      - about.qmd
editor: source

brand: _brand.yml

custom-callout:
  wpg:
    color: "#F1B300"
    icon: false
filters:
- custom-callout
