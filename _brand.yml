meta:
  name: brand.yml
  links:
    home: uidaho.edu

logo:
  images:
    icon-ui: images/u-of-i-logo-2018.png
    icon-ext:  images/UI-Extension-H-4c.jpg
  #small: icon-ui
 # medium: icon-ui
  #large: icon-ui

color:

  palette:
    ui-gold: "#F1B300"
    ui-metalgold: "#857550"
    ui-silver: "#808080"
    ui-black: "#191919"
    teal: "#008094"
    purple: "#5E48FF" # for after
    white: "#fff"
    orange: "#FF6F20"
    pink: "#FF3D7F"
    green: "#28A745"
    blue: "#1034a6 "
    
  background: white
  foreground: ui-black
  primary: teal
  secondary: ui-black
  tertiary: purple
  success: green
  info: blue
  warning: orange
  danger: pink

typography:

  fonts:
    - family: Public Sans
      source: google
    - family: IBM Plex Mono
      source: google
    - family: Gintronic
      #source: google

  base:
    family: Public Sans
    line-height: 1.6
  headings:
    family: Gintronic
    weight: normal
  link:
    color: teal
  monospace:
    family: IBM Plex Mono
    size: 1em

defaults:
  bootstrap:
    defaults:
      navbar-bg: "#F1B300"
      navbar-fg: "#fff"
      navbar-hl: "#191919"
